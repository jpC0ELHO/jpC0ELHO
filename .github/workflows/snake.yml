name: Gerar cobrinha de contribuições
 
on:
  schedule:
    - cron: "0 */12 * * *"   
  workflow_dispatch:          
  push:
    branches: [main]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8b008b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8b008b
 
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
